<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universidades - Listado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLpI4+X/NlQf+v/iP1g2qM5T1Jp/L5M/QoG5Q25Fj9T3O1j6m6w+H7n3w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .university-card:hover {
        transform: translateY(-5px);
        transition: transform 0.3s ease;
      }
      .category-btn {
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        transform: scale(1);
      }
      .category-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.5)
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .category-btn:hover::before {
        opacity: 1;
      }
      .category-active {
        background: linear-gradient(135deg, #14a085, #0d7377);
        color: white !important;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transform: scale(1.02);
      }
      .category-active .filter-icon {
        color: white;
      }
      .category-btn-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .nav-item-fancy {
        position: relative;
      }
      .nav-item-fancy::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 0;
        height: 2px;
        background-color: #f4d03f;
        transition: all 0.3s ease-in-out;
        transform: translateX(-50%);
      }
      .nav-item-fancy:hover::after {
        width: 100%;
      }
      .nav-item-fancy.active::after {
        width: 100%;
        background-color: white;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "impulso-green": "#0D7377",
              "impulso-teal": "#14A085",
              "impulso-light": "#7FCDCD",
              "impulso-gold": "#F4D03F",
              "impulso-dark": "#0A5D61",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-gradient-to-br from-impulso-light to-emerald-100 min-h-screen"
  >
    <nav
      class="bg-gradient-to-r from-impulso-green to-impulso-teal text-white shadow-lg sticky top-0 z-50 backdrop-blur-sm bg-opacity-90"
    >
      <div
        class="container mx-auto px-4 py-3 flex justify-between items-center"
      >
        <div class="flex items-center space-x-2">
          <img
            src="src/img/logo.jpg"
            alt="Logo Impulso Educativo con libro abierto y birrete de graduación"
            class="w-16 h-16 rounded-full ring-2 ring-impulso-gold p-1"
          />
          <h1 class="text-2xl font-bold select-none tracking-wide">
            Educación Universitaria
          </h1>
        </div>

        <div class="hidden md:flex space-x-6">
          <a
            href="index.html"
            class="nav-item-fancy hover:text-impulso-light transition-colors"
            >Inicio</a
          >
          <a
            href="#universidades"
            class="nav-item-fancy hover:text-impulso-light transition-colors active"
            >Universidades</a
          >
          <a
            href="#programas"
            class="nav-item-fancy hover:text-impulso-light transition-colors"
            >Programas</a
          >
          <a
            href="#contacto"
            class="nav-item-fancy hover:text-impulso-light transition-colors"
            >Contacto</a
          >
        </div>

        <button
          class="md:hidden text-white hover:text-impulso-light transition-colors"
          aria-label="Abrir menú"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </div>
    </nav>

    <header class="bg-impulso-green text-white py-12 px-4 shadow-inner">
      <div class="container mx-auto text-center">
        <h2 class="text-4xl font-extrabold mb-4 select-none tracking-wide">
          Encontrá tu Universidad Ideal 🎓
        </h2>
        <p class="text-xl max-w-2xl mx-auto font-light">
          Explorá nuestras instituciones afiliadas y conseguí el lugar perfecto
          para tu formación académica.
        </p>
      </div>
    </header>

    <main class="container mx-auto py-8 px-4">
      <div
        class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 mb-8"
      >
        <h3
          class="text-2xl font-semibold text-impulso-dark mb-4 select-none flex items-center gap-2"
        >
          <i class="fas fa-filter text-impulso-teal"></i> Filtrar Universidades
        </h3>

        <div class="mb-6 relative">
          <i
            class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
          ></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por nombre o ubicación..."
            class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-impulso-teal focus:border-transparent transition shadow-inner"
            aria-label="Buscar universidades"
          />
        </div>

        <div
          class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"
          id="categoryFilters"
        >
          <button
            class="category-btn p-3 rounded-lg text-center bg-gray-100 text-gray-700 hover:bg-impulso-gold hover:text-white transition-all duration-300 category-active"
            data-category="todas"
            type="button"
          >
            <span class="category-btn-content">
              <i class="fas fa-globe-americas filter-icon text-impulso-dark"></i
              >Todas
            </span>
          </button>
          <button
            class="category-btn p-3 rounded-lg text-center bg-gray-100 text-gray-700 hover:bg-impulso-gold hover:text-white transition-all duration-300"
            data-category="sociales"
            type="button"
          >
            <span class="category-btn-content">
              <i class="fas fa-users filter-icon text-impulso-dark"></i>Ciencias
              Sociales
            </span>
          </button>
          <button
            class="category-btn p-3 rounded-lg text-center bg-gray-100 text-gray-700 hover:bg-impulso-gold hover:text-white transition-all duration-300"
            data-category="naturales"
            type="button"
          >
            <span class="category-btn-content">
              <i class="fas fa-leaf filter-icon text-impulso-dark"></i>Ciencias
              Naturales
            </span>
          </button>
          <button
            class="category-btn p-3 rounded-lg text-center bg-gray-100 text-gray-700 hover:bg-impulso-gold hover:text-white transition-all duration-300"
            data-category="tecnologicas"
            type="button"
          >
            <span class="category-btn-content">
              <i class="fas fa-microchip filter-icon text-impulso-dark"></i
              >Tecnológicas
            </span>
          </button>
          <button
            class="category-btn p-3 rounded-lg text-center bg-gray-100 text-gray-700 hover:bg-impulso-gold hover:text-white transition-all duration-300"
            data-category="artes"
            type="button"
          >
            <span class="category-btn-content">
              <i class="fas fa-paint-brush filter-icon text-impulso-dark"></i
              >Artes y Humanidades
            </span>
          </button>
          <button
            class="category-btn p-3 rounded-lg text-center bg-gray-100 text-gray-700 hover:bg-impulso-gold hover:text-white transition-all duration-300"
            data-category="medicina"
            type="button"
          >
            <span class="category-btn-content">
              <i class="fas fa-heartbeat filter-icon text-impulso-dark"></i
              >Ciencias de la Salud
            </span>
          </button>
        </div>
      </div>

      <div
        class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch"
        id="universitiesContainer"
      ></div>
    </main>

    <footer
      class="bg-gradient-to-r from-impulso-green to-impulso-teal text-white py-8 mt-12 shadow-inner"
    >
      <div class="container mx-auto px-4 text-center select-none">
        <p>
          &copy; 2024 Educación Universitaria. Todos los derechos reservados.
        </p>
      </div>
    </footer>

    <script>
      // Datos de las universidades
      const universities = [
        {
          id: 1,
          name: "Universidad Nacional de Formosa",
          type: "sociales",
          location: " Formosa , Formosa",
          description:
            "UNaF, Universidad Nacional de Formosa, ofrece 36 títulos oficiales para estudiar en Argentina. líder en investigación científica y desarrollo tecnológico.",
          founded: "-",
          students: "-",
          image: "src/img/unaf.jpg",
        },
        {
          id: 2,
          name: "Instituto Politécnico Formosa",
          type: "tecnologicas",
          location: "Formosa, Formosa",
          description:
            "Ofrece tecnicaturas superiores especializadas en áreas de alta tecnología y con salida laboral, como mecatrónica y desarrollo de software",
          founded: "-",
          students: "-",
          image: "src/img/ipf.jpg",
        },
        {
          id: 3,
          name: "Universidad de la Cuenca del Plata",
          type: "medicina",
          location: "Formosa, Argentina",
          description:
            "Una universidad privada con una amplia oferta académica en el Nordeste Argentino, que incluye carreras en áreas de ciencias sociales, salud, ingeniería y derecho.",
          founded: "-",
          students: "-",
          image: "src/img/cuenca.jpg", // Puedes usar una imagen representativa.
        },
        {
          id: 4,
          name: "Universidad Tecnológica Nacional",
          type: "tecnologicas",
          location: "Formosa, Formosa",
          description:
            "La UTN es la única universidad en Argentina con un enfoque prioritario en la ingeniería. Su sede regional en Formosa ofrece tecnicaturas y licenciaturas con alta salida laboral, contribuyendo al desarrollo tecnológico loca",
          founded: "-",
          students: "-",
          image: "src/img/logo-utn.jpg",
        },
        {
          id: 5,
          name: "Instituto Superior Macedo Martínez",
          type: "tecnologicas",
          location: "Formosa, Argentina",
          description:
            "Institución pionera en la educación terciaria privada en Formosa, con una fuerte oferta en carreras técnicas como Analista de Sistemas de Información y profesorados.",
          founded: "-",
          students: "-",
          image: "src/img/macedo.jpg", // Puedes usar una imagen representativa.
        },
      ];

      let selectedCategory = "todas";
      let searchTerm = "";

      // Función para renderizar las universidades
      // Función para renderizar las universidades
      function renderUniversities() {
        const container = document.getElementById("universitiesContainer");
        container.innerHTML = "";

        const filtered = universities.filter((uni) => {
          const matchesCategory =
            selectedCategory === "todas" || uni.type === selectedCategory;
          const matchesSearch =
            uni.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            uni.location.toLowerCase().includes(searchTerm.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
      <div class="col-span-full text-center py-12">
        <div class="text-gray-500 text-lg">
          <i class="fas fa-exclamation-triangle text-impulso-gold mb-2"></i>
          <p>No se encontraron universidades que coincidan con los criterios de búsqueda.</p>
        </div>
      </div>
    `;
          return;
        }

        filtered.forEach((uni) => {
          const card = document.createElement("div");
          card.className =
            "bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden university-card hover:shadow-2xl transition-all flex flex-col";
          card.innerHTML = `
      <img src="${uni.image}" alt="${
            uni.name
          } campus view" class="w-full h-48 object-contain bg-white">
      <div class="p-6 flex flex-col flex-grow">
        <h4 class="text-2xl font-bold text-impulso-dark mb-2">${uni.name}</h4>
        <span class="inline-block bg-impulso-light text-impulso-dark text-xs font-semibold px-3 py-1 rounded-full mb-3 tracking-wide">
          <i class="fas fa-tag"></i> ${getCategoryName(uni.type)}
        </span>
        <p class="text-gray-600 mb-3 flex items-center gap-2"><i class="fas fa-map-marker-alt text-impulso-teal"></i> ${
          uni.location
        }</p>
        <p class="text-gray-700 mb-4 text-sm">${uni.description}</p>
        <div class="flex justify-between text-sm text-gray-500 border-t border-gray-200 pt-4 mt-auto">
          <span class="flex items-center gap-1"><i class="fas fa-calendar-alt text-impulso-dark"></i> Fundada: ${
            uni.founded
          }</span>
          <span class="flex items-center gap-1"><i class="fas fa-user-graduate text-impulso-dark"></i> ${uni.students.toLocaleString()} estudiantes</span>
        </div>
        <button class="w-full mt-4 bg-gradient-to-r from-impulso-green to-impulso-teal text-white py-2 px-4 rounded-lg hover:from-impulso-dark hover:to-impulso-green transition-colors font-semibold shadow-md hover:shadow-lg">
          Ver más información
        </button>
      </div>
    `;
          container.appendChild(card);
        });
      }
      // Función para obtener el nombre de la categoría
      function getCategoryName(type) {
        const categories = {
          sociales: "Ciencias Sociales",
          naturales: "Ciencias Naturales",
          tecnologicas: "Tecnológicas",
          artes: "Artes y Humanidades",
          medicina: "Ciencias de la Salud",
        };
        return categories[type] || type;
      }

      // Event listeners
      document.addEventListener("DOMContentLoaded", function () {
        // Filtros de categoría
        document.querySelectorAll(".category-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            document
              .querySelectorAll(".category-btn")
              .forEach((b) => b.classList.remove("category-active"));
            this.classList.add("category-active");
            selectedCategory = this.dataset.category;
            renderUniversities();
          });
        });

        // Búsqueda
        document
          .getElementById("searchInput")
          .addEventListener("input", function (e) {
            searchTerm = e.target.value;
            renderUniversities();
          });

        // Renderizar inicialmente
        renderUniversities();
      });
    </script>
  </body>
</html>
